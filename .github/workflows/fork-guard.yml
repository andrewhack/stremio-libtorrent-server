name: Fork integration guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate fork-owned files
        shell: bash
        run: |
          set -euo pipefail
          test -s SERVER_VERSION
          test -s FORK_VERSION
          test -s webadmin/WEBADMIN_VERSION
          test -f VERSIONING.md
          test -f compose.yaml
          test -f compose.dns.yaml
          test -f Dockerfile
          test -f docker/webadmin_entrypoint.py
          test -f webadmin/app.py
          test -f webadmin/fork_update.py
          test -f webadmin/version_lifecycle.py
          test -f webadmin/static/component-versions.js

          cmp -s SERVER_VERSION FORK_VERSION || {
            echo 'SERVER_VERSION and FORK_VERSION must contain the same value.'
            exit 1
          }

          grep -q '^  webadmin:' compose.yaml
          grep -q '^  pihole:' compose.yaml
          grep -q '172.30.0.53' compose.yaml
          grep -q 'https://github.com/emmanique/stremio-libtorrent-server-webadmin' compose.yaml
          grep -q 'STREMIO_UPDATE_HEALTH_TIMEOUT' compose.yaml
          grep -q 'SERVER_VERSION' Dockerfile
          grep -q 'FORK_VERSION' Dockerfile
          grep -q 'version_lifecycle:app' webadmin/Dockerfile
          grep -q 'WEBADMIN_VERSION' webadmin/Dockerfile

          if grep -R --line-number --fixed-strings \
            'https://github.com/andrewhack/stremio-libtorrent-server' \
            webadmin compose.yaml Dockerfile docker/webadmin_entrypoint.py; then
            echo 'Runtime/update paths must not use the upstream repository as their source.'
            exit 1
          fi

      - name: Validate transactional updater guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'update-checkpoint.json' webadmin/fork_update.py
          grep -q 'rollback' webadmin/fork_update.py
          grep -q '_wait_healthy' webadmin/fork_update.py
          grep -q '_restore_old_container' webadmin/fork_update.py
          grep -q 'create_container' webadmin/fork_update.py
          grep -q 'previousImageId' webadmin/fork_update.py
          grep -q 'coreVersion' webadmin/fork_update.py
          grep -q 'forkVersion' webadmin/fork_update.py

      - name: Validate independent component lifecycle
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER_VERSION_URL' webadmin/version_lifecycle.py
          grep -q 'WEBADMIN_VERSION_URL' webadmin/version_lifecycle.py
          grep -q '/api/component-versions' webadmin/version_lifecycle.py
          grep -q 'guarded_server_update_worker' webadmin/version_lifecycle.py
          grep -q 'guarded_update' webadmin/version_lifecycle.py
          grep -q '_replace_route("/api/update")' webadmin/version_lifecycle.py
          grep -q 'installed == available' webadmin/version_lifecycle.py
          grep -q 'updateInProgress' webadmin/version_lifecycle.py
          grep -q 'docker compose up -d --build --no-deps webadmin' webadmin/version_lifecycle.py
          grep -q 'Server installed' webadmin/static/component-versions.js
          grep -q 'WebAdmin installed' webadmin/static/component-versions.js
          grep -q 'Core installed' webadmin/static/component-versions.js
          grep -q 'Update Server' webadmin/static/component-versions.js
          grep -q 'guardedUpdateClick' webadmin/static/component-versions.js
          grep -q 'server?.updateAvailable === true' webadmin/static/component-versions.js
          grep -q 'Independent release lifecycles' webadmin/static/component-versions.js

      - name: Validate trusted connection URL integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'httpsCert.json' webadmin/version_lifecycle.py
          grep -q 'stremio\\.rocks' webadmin/version_lifecycle.py
          grep -q -- '--development --webui-url=' webadmin/version_lifecycle.py
          grep -q '_replace_route("/api/status")' webadmin/version_lifecycle.py
          grep -q '_replace_route("/api/qr.svg")' webadmin/version_lifecycle.py
          grep -q 'trustedHttps' webadmin/version_lifecycle.py

      - name: Validate default Docker Compose
        run: docker compose config --quiet

      - name: Validate LAN DNS override
        run: docker compose -f compose.yaml -f compose.dns.yaml config --quiet

      - name: Compile WebAdmin integration code
        run: python -m compileall -q webadmin docker/webadmin_entrypoint.py

      - name: Validate WebAdmin lifecycle JavaScript
        run: node --check webadmin/static/component-versions.js
